set $mode_resize "hjkl/arrows  resize | +/-  gaps"

mode $mode_resize {
    # left will shrink the container's width
    # right will grow the container's width
    # up will grow the container's height
    # down will shrink the container's height
    $bindsym $left resize shrink width 10px
    $bindsym $down resize shrink height 10px
    $bindsym $up resize grow height 10px
    $bindsym $right resize grow width 10px

    $bindsym $left_alt resize shrink width 10px
    $bindsym $down_alt resize shrink height 10px
    $bindsym $up_alt resize grow height 10px
    $bindsym $right_alt resize grow width 10px

    $bindsym Shift+$left resize shrink width 50px
    $bindsym Shift+$down resize shrink height 50px
    $bindsym Shift+$up resize grow height 50px
    $bindsym Shift+$right resize grow width 50px

    $bindsym Shift+$left_alt resize shrink width 50px
    $bindsym Shift+$down_alt resize shrink height 50px
    $bindsym Shift+$up_alt resize grow height 50px
    $bindsym Shift+$right_alt resize grow width 50px

    ## Resize // Window Gaps // + - ##
    $bindsym minus gaps inner current minus 5px
    $bindsym plus gaps inner current plus 5px

    # Return to default mode
    $bindsym Return mode "default"
    $bindsym Escape mode "default"
}
## Launch // Resize Mode ##
$bindsym $mod+r mode $mode_resize
